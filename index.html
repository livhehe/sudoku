<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Sudoku Race</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="home-container">
    <h1>Sudoku Hehe</h1>
    <div id="signin-section">
      <input type="text" id="username-input" maxlength="20" placeholder="Enter your username">
      <button id="signin-btn">Sign In</button>
    </div>
    <div id="menu-section" style="display:none;">
      <p id="welcome-message"></p>
      <button id="solo-btn">Solo Game</button>
      <button id="share-btn">Create Race</button>
      <div id="race-setup-section" style="display:none;">
        <p>Choose race difficulty:</p>
        <button class="race-difficulty-btn" data-difficulty="Easy" data-clues="40">Easy</button>
        <button class="race-difficulty-btn" data-difficulty="Medium" data-clues="32">Medium</button>
        <button class="race-difficulty-btn" data-difficulty="Hard" data-clues="26">Hard</button>
        <button id="race-back-btn" type="button">Back</button>
      </div>
      <button id="enter-code-btn">Join Race</button>
      <div id="join-section" style="display:none;">
        <input id="room-code-input" maxlength="5" placeholder="5-character code" autocomplete="off">
        <button id="join-room-btn">Join</button>
      </div>
      <div id="room-panel" style="display:none;">
        <p>Room code: <strong id="room-code-display"></strong></p>
        <p id="room-status">Waiting for another player…</p>
        <div id="race-players"></div>
        <button id="copy-code-btn">Copy code</button>
        <button id="leave-room-btn">Leave race</button>
      </div>
      <div id="leaderboard">
        <h2>Leaderboard</h2>
        <ul id="leaderboard-list"></ul>
      </div>
    </div>
  </div>

  <div id="game-area" style="display:none;">
    <h1 id="game-title">Sudoku Hehe</h1>
    <div id="opponent-progress" style="display:none;"></div>
    <div id="game-subheader">
      <div id="game-difficulty">Solo Puzzle: Easy</div>
      <button id="home-game-btn" type="button">Home</button>
    </div>
    <div id="race-status" aria-live="polite"></div>
    <div id="game-toolbar">
      <div id="toolbar-left">
        <div id="controls">
          <span id="new-puzzle-label">New Puzzle</span>
          <button class="diff-btn" data-clues="40">Easy</button>
          <button class="diff-btn" data-clues="32">Medium</button>
          <button class="diff-btn" data-clues="26">Hard</button>
        </div>
      </div>
      <div id="timer">0:00</div>
      <div id="mistake-panel">
        <div id="mistake-label">Mistakes</div>
        <div id="mistake-counter" aria-live="polite">0/3</div>
      </div>
    </div>
    <div id="sudoku-board"></div>
    <div id="number-pad">
      <button class="num-btn">1</button>
      <button class="num-btn">2</button>
      <button class="num-btn">3</button>
      <button class="num-btn">4</button>
      <button class="num-btn">5</button>
      <button class="num-btn">6</button>
      <button class="num-btn">7</button>
      <button class="num-btn">8</button>
      <button class="num-btn">9</button>
    </div>
    <div id="pad-controls">
      <button class="pad-control erase">Erase</button>
      <button id="pencil-btn" class="pad-control">Pencil: Off</button>
    </div>
  </div>
  <script type="module" src="./firebase-init.js"></script>
  <script src="./main.js"></script>
</body>
</html>
